<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
        PrefectConnect
        {% endblock %}
    </title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">

    <!-- Page-specific CSS -->
    {% block css %}
    {% endblock %}

</head>
<body>
    <div class ="layout">

        <!--Side Bar-->
        <div class="sidebar">

            <h2>PREFECTS</h2>

            <a href="/dashboard">Dashboard</a>
            <a href="/locker-duty">Locker Duty</a>
            <a href="#">Notices</a>
            <a href="#">Chat</a>
            <a href="#">Assemblies</a>

            <a href="/logout" class="logout">Logout</a>

        </div>

        <main class="main-content">

            {% block content %}
            {% endblock %}

        </main>
    </div>

    {% block scripts %}
    {% endblock %}

</body>
</html>
