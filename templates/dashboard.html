{% extends "layout.html" %}

{% block title %}
Dashboard
{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
{% endblock %}

{% block content %}

<div class="topbar">
    <h1>Dashboard</h1>
    <p>Welcome {{ user.name }}</p>
</div>

<div class="cards">

    <div class="card">
        <h3>Locker Duty</h3>
        <p>Next duty: Tomorrow</p>
    </div>

    <div class="card">
        <h3>Notices</h3>
        <p>{{ notice_count }} new announcements</p>
    </div>

    <div class="card">
        <h3>Chat</h3>
        <p>Open discussions</p>
    </div>

</div>

{% endblock %}
